name: Validate technical-talk-workflow
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Request contract and demo storyboard
        run: |
          python scripts/validate_request.py assets/talk-request-minimal.json
          python scripts/validate_request.py assets/talk-request-recommended.json --strict
          python scripts/validate_request.py examples/novel-topic-test/request.json --strict
          python scripts/check_demo_storyboard.py assets/demo-storyboard-template.json --allow-template
          python scripts/check_demo_storyboard.py examples/novel-topic-test/demo-storyboard.json
      - name: Example structural alignment
        run: |
          python scripts/check_alignment.py --outline examples/sample-talk/outline.json --projection examples/sample-talk/projection.md --notes examples/sample-talk/speaker_notes.md
      - name: Example content and media audit
        run: |
          python scripts/audit_talk.py --outline examples/sample-talk/outline.json --projection examples/sample-talk/projection.md --notes examples/sample-talk/speaker_notes.md --visuals examples/sample-talk/visuals.json --strict-warnings
      - name: Novel-topic smoke fixture alignment
        run: |
          python scripts/check_alignment.py --outline examples/novel-topic-test/outline.json --projection examples/novel-topic-test/projection.md --notes examples/novel-topic-test/speaker_notes.md
          python scripts/audit_talk.py --outline examples/novel-topic-test/outline.json --projection examples/novel-topic-test/projection.md --notes examples/novel-topic-test/speaker_notes.md --visuals examples/novel-topic-test/visuals.json --strict-warnings
      - name: Check for accidentally committed secrets
        run: python scripts/privacy_scan.py .
